name: Mobile release QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-release-qa
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser harness
        run: npm install --no-save --ignore-scripts playwright@1.51.1
      - name: Install browser binaries
        run: npx playwright install --with-deps chromium webkit
      - name: Real portrait browser regression
        run: QA_WEBKIT=1 node qa/browser-smoke.cjs
      - name: Keep screenshots and exact test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaesopang-mobile-qa
          path: qa-output/
          if-no-files-found: warn
